<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lofi Room</title>
    <meta name="description" content="Full-screen pixel-art scenes with lofi stations from YouTube, ambient sound that follows the time of day, and a focus timer." />
    <meta name="theme-color" content="#0b0816" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lofi Room" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thiraphat-ps-dev.github.io/lofi-room/" />
    <meta property="og:title" content="Lofi Room" />
    <meta property="og:description" content="Full-screen pixel-art scenes with lofi stations, ambient sound that follows the time of day, and a focus timer." />
    <meta property="og:image" content="https://thiraphat-ps-dev.github.io/lofi-room/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A pixel-art room at night, rain on the window, a cat asleep on the desk" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="fonts/ThiraSans-VF.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <!-- icons, drawn once and reused -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l10.6-6.8a1 1 0 0 0 0-1.72L9.5 4.34A1 1 0 0 0 8 5.2z" fill="currentColor" /></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.2" fill="currentColor" /><rect x="13.5" y="5" width="4" height="14" rx="1.2" fill="currentColor" /></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 6.2v11.6a.8.8 0 0 1-1.25.66L8.6 12.66a.8.8 0 0 1 0-1.32l8.15-5.8A.8.8 0 0 1 18 6.2zM6 6v12" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 6.2v11.6a.8.8 0 0 0 1.25.66l8.15-5.8a.8.8 0 0 0 0-1.32l-8.15-5.8A.8.8 0 0 0 6 6.2zM18 6v12" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></symbol>
      <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></symbol>
      <symbol id="i-rain" viewBox="0 0 24 24"><path d="M7 15.5a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8a3.75 3.75 0 0 1 .5 7.47M8 18l-1 2.5M12 17l-1 3M16 18l-1 2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8" /><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" /></symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 10.5a3.75 3.75 0 0 1 .5 7.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" /></symbol>
      <symbol id="i-storm" viewBox="0 0 24 24"><path d="M7 15.5a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8a3.75 3.75 0 0 1 .5 7.47M13 13l-3 4.5h4l-3 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></symbol>
      <symbol id="i-fog" viewBox="0 0 24 24"><path d="M4 9h16M6 13h12M4 17h16M8 5h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></symbol>
      <symbol id="i-snow" viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5 12 7l2.5-2.5M9.5 19.5 12 17l2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5zM15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A9.9 9.9 0 0 1 12 5c5 0 8.5 4.5 9.5 7a13 13 0 0 1-2.7 3.9M6.6 6.6C4.4 8 3 10.2 2.5 12c1 2.5 4.5 7 9.5 7a9.6 9.6 0 0 0 4.4-1.1M9.9 9.9a3 3 0 0 0 4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12C3.5 9.5 7 5 12 5s8.5 4.5 9.5 7c-1 2.5-4.5 7-9.5 7s-8.5-4.5-9.5-7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" /><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8" /></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9.5a6 6 0 0 1 12 0c0 4.5 1.8 6 2.5 6.5h-17C4.2 15.5 6 14 6 9.5zM10 19.5a2.2 2.2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8" /><path d="M16 16l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></symbol>
    </svg>

    <div class="hud" id="hud">
      <header class="top">
        <div class="clock">
          <p class="time" id="time">--:--</p>
          <p class="date" id="date"></p>
          <p class="festival" id="festival" hidden></p>
        </div>

        <div class="tools">
          <div class="glass segmented" role="group" aria-label="เลือกฉาก" data-i18n-aria="scenes" id="scene-picker"></div>
          <div class="glass mini">
            <button class="chip" id="amb-toggle" type="button" aria-pressed="false">
              <svg class="icon" aria-hidden="true"><use href="#i-rain" /></svg><span data-i18n="amb">เสียงรอบตัว</span>
            </button>
            <input id="amb-vol" type="range" min="0" max="100" value="35" aria-label="ความดังเสียงรอบตัว" data-i18n-aria="ambVol" />
          </div>
          <button class="glass chip time-btn" id="time-mode" type="button">
            <svg class="icon" aria-hidden="true"><use href="#i-sun" /></svg><span id="time-label">อัตโนมัติ</span>
          </button>
          <button class="glass chip time-btn" id="weather-mode" type="button">
            <svg class="icon" aria-hidden="true"><use href="#i-cloud" /></svg><span id="weather-label">อากาศตามธรรมชาติ</span>
          </button>
          <div class="glass mini timer-box">
            <span class="mode" id="focus-mode">โฟกัส</span>
            <span class="timer" id="focus-time">25:00</span>
            <button class="chip" id="focus-start" type="button">เริ่ม</button>
            <button class="icon-btn" id="focus-reset" type="button" title="รีเซ็ตเวลา" data-i18n-title="reset">
              <svg class="icon" aria-hidden="true"><use href="#i-reset" /></svg>
            </button>
            <button class="icon-btn" id="focus-notify" type="button" aria-pressed="false" aria-label="แจ้งเตือนเมื่อหมดรอบ" title="แจ้งเตือนเมื่อหมดรอบ" hidden>
              <svg class="icon" aria-hidden="true"><use href="#i-bell" /></svg>
            </button>
          </div>
          <button class="glass icon-btn round lang-btn" id="lang" type="button" lang="en" aria-label="Switch to English" title="Switch to English">EN</button>
          <button class="glass icon-btn round" id="hide-ui" type="button" aria-pressed="false" aria-label="ซ่อนแผง" title="ซ่อนแผง">
            <svg class="icon" aria-hidden="true"><use href="#i-eye-off" /></svg>
          </button>
        </div>
      </header>

      <footer class="bottom">
        <div class="glass deck" aria-label="เครื่องเล่น" data-i18n-aria="player">
          <div class="screen" id="screen">
            <div id="player"></div>
            <div class="screen-gen" aria-live="off">
              <svg class="cassette" viewBox="0 0 64 40" aria-hidden="true" shape-rendering="crispEdges">
                <rect x="1" y="3" width="62" height="35" rx="3" fill="#2a2440" />
                <rect x="5" y="7" width="54" height="16" rx="1" fill="#ece2cc" />
                <rect x="5" y="8" width="54" height="3" fill="var(--accent)" />
                <rect x="14" y="13" width="36" height="9" rx="4.5" fill="#1a1626" />
                <g class="reel" style="transform-origin: 20px 17.5px"><circle cx="20" cy="17.5" r="3.4" fill="#ece2cc" /><path d="M20 14.3v6.4M16.8 17.5h6.4" stroke="#1a1626" stroke-width="1" /></g>
                <g class="reel" style="transform-origin: 44px 17.5px"><circle cx="44" cy="17.5" r="3.4" fill="#ece2cc" /><path d="M44 14.3v6.4M40.8 17.5h6.4" stroke="#1a1626" stroke-width="1" /></g>
                <path d="M14 38l4-9h28l4 9z" fill="#3a3356" />
                <circle cx="22" cy="33" r="1.4" fill="#1a1626" /><circle cx="42" cy="33" r="1.4" fill="#1a1626" />
              </svg>
              <p class="gen-chord" id="gen-chord">♪</p>
              <p class="gen-meta" id="gen-meta"></p>
            </div>
            <p class="screen-empty" id="screen-empty" data-i18n="empty">เลือกสถานีเพื่อเริ่มฟัง</p>
          </div>
          <div class="deck-side">
            <div class="now">
              <p class="label" data-i18n="nowPlaying">กำลังเล่น</p>
              <p class="title" id="title">ยังไม่ได้เลือกสถานี</p>
              <p class="error" id="error" hidden></p>
            </div>
            <div class="transport">
              <button class="icon-btn" id="prev" type="button" aria-label="เพลงก่อนหน้า" data-i18n-aria="prev" disabled>
                <svg class="icon" aria-hidden="true"><use href="#i-prev" /></svg>
              </button>
              <button class="icon-btn play" id="play" type="button" aria-label="เล่น" data-playing="false" disabled>
                <svg class="icon i-play" aria-hidden="true"><use href="#i-play" /></svg>
                <svg class="icon i-pause" aria-hidden="true"><use href="#i-pause" /></svg>
              </button>
              <button class="icon-btn" id="next" type="button" aria-label="เพลงถัดไป" data-i18n-aria="next" disabled>
                <svg class="icon" aria-hidden="true"><use href="#i-next" /></svg>
              </button>
              <div class="volume">
                <svg class="icon" aria-hidden="true"><use href="#i-volume" /></svg>
                <input id="vol" type="range" min="0" max="100" value="60" aria-label="ความดังเพลง" data-i18n-aria="vol" />
              </div>
            </div>
          </div>
        </div>

        <div class="glass stations-box collapsible">
          <div class="stations-head">
            <p class="label" data-i18n="stations">สถานี</p>
            <p class="count" id="station-count" aria-live="polite"></p>
          </div>
          <div class="cats" role="group" aria-label="หมวดสถานี" data-i18n-aria="categories" id="station-cats"></div>
          <div class="station-search">
            <svg class="icon" aria-hidden="true"><use href="#i-search" /></svg>
            <label class="sr-only" for="station-q" data-i18n="search">ค้นหาสถานี</label>
            <input id="station-q" type="search" autocomplete="off" placeholder="ค้นหา เช่น ฝน, แจ๊ส, ไลฟ์" data-i18n-placeholder="searchHint" />
          </div>
          <div class="stations" id="stations"></div>
          <details class="own">
            <summary><svg class="icon" aria-hidden="true"><use href="#i-link" /></svg><span data-i18n="own">เปิดลิงก์ของตัวเอง</span></summary>
            <form class="load" id="load-form">
              <label class="sr-only" for="url" data-i18n="urlLabel">ลิงก์ YouTube หรือ YouTube Music</label>
              <input id="url" type="url" inputmode="url" placeholder="music.youtube.com/watch?v=…" autocomplete="off" />
              <button class="chip primary" type="submit" data-i18n="open">เปิด</button>
            </form>
          </details>
        </div>
      </footer>
    </div>

    <!-- modules run in order, after the page has parsed: the scenes first, then the app -->
    <script type="module" src="scenes/engine.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
