<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lofi Room</title>
    <meta name="description" content="Full-screen pixel-art scenes with lofi stations from YouTube, rain ambience and a focus timer." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&family=Noto+Sans+Thai:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <div class="hud" id="hud">
      <header class="top">
        <div class="clock">
          <p class="time" id="time">--:--</p>
          <p class="date" id="date"></p>
        </div>

        <div class="tools">
          <div class="box scenes" role="group" aria-label="เลือกฉาก" id="scene-picker"></div>
          <div class="box mini">
            <button class="btn toggle" id="rain-toggle" type="button" aria-pressed="false">ฝน: ปิด</button>
            <input id="rain-vol" type="range" min="0" max="100" value="35" aria-label="ความดังเสียงฝน" />
          </div>
          <div class="box mini timer-box">
            <span class="mode" id="focus-mode">โฟกัส</span>
            <span class="timer" id="focus-time">25:00</span>
            <button class="btn toggle" id="focus-start" type="button">เริ่ม</button>
            <button class="btn" id="focus-reset" type="button" aria-label="รีเซ็ตเวลา">↺</button>
          </div>
          <button class="btn" id="hide-ui" type="button" aria-pressed="false">ซ่อนแผง</button>
        </div>
      </header>

      <footer class="bottom">
        <div class="box deck" aria-label="เครื่องเล่น">
          <div class="screen">
            <div id="player"></div>
            <p class="screen-empty" id="screen-empty">เลือกสถานีด้านขวา</p>
          </div>
          <div class="deck-side">
            <div class="now">
              <p class="label">กำลังเล่น</p>
              <p class="title" id="title">ยังไม่ได้เลือกสถานี</p>
              <p class="error" id="error" hidden></p>
            </div>
            <div class="transport">
              <button class="btn icon" id="prev" type="button" aria-label="เพลงก่อนหน้า" disabled>&lt;&lt;</button>
              <button class="btn icon primary" id="play" type="button" aria-label="เล่น" disabled>▶</button>
              <button class="btn icon" id="next" type="button" aria-label="เพลงถัดไป" disabled>&gt;&gt;</button>
              <input id="vol" type="range" min="0" max="100" value="60" aria-label="ความดังเพลง" />
            </div>
          </div>
        </div>

        <div class="box stations-box collapsible">
          <p class="label">สถานี</p>
          <div class="stations" id="stations"></div>
          <details class="own">
            <summary>เปิดลิงก์ของตัวเอง</summary>
            <form class="load" id="load-form">
              <label class="sr-only" for="url">ลิงก์ YouTube หรือ YouTube Music</label>
              <input id="url" type="url" inputmode="url" placeholder="music.youtube.com/watch?v=…" autocomplete="off" />
              <button class="btn primary" type="submit">เปิด</button>
            </form>
          </details>
        </div>
      </footer>
    </div>

    <script src="scenes.js"></script>
    <script src="app.js"></script>
  </body>
</html>
